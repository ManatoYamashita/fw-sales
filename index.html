<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Firstweb Lead OS — 飲食店WEB集客支援の営業オペレーション管理アプリ">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lead OS">
  <!-- OGP -->
  <meta property="og:title"       content="Firstweb Lead OS">
  <meta property="og:description" content="飲食店WEB集客支援の営業管理OS">
  <meta property="og:type"        content="website">

  <title>Firstweb Lead OS</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">

  <!-- App styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== SIDEBAR ========== -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon"><i class="fas fa-bolt"></i></span>
        <div class="logo-text">
          <span class="logo-main">Firstweb</span>
          <span class="logo-sub">Lead OS</span>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-label">メイン</div>
        <a class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
          <i class="fas fa-th-large"></i><span>ダッシュボード</span>
        </a>
        <a class="nav-item" data-page="pipeline" onclick="navigate('pipeline')">
          <i class="fas fa-stream"></i><span>パイプライン</span>
          <span class="nav-badge" id="badge-pipeline">0</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-label">店舗</div>
        <a class="nav-item" data-page="stores" onclick="navigate('stores')">
          <i class="fas fa-store"></i><span>店舗一覧</span>
          <span class="nav-badge" id="badge-stores">0</span>
        </a>
        <a class="nav-item" data-page="store-new" onclick="navigate('store-new')">
          <i class="fas fa-plus-circle"></i><span>店舗登録</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-label">営業</div>
        <a class="nav-item" data-page="research" onclick="navigate('research')">
          <i class="fas fa-search"></i><span>調査キュー</span>
          <span class="nav-badge badge-yellow" id="badge-research">0</span>
        </a>
        <a class="nav-item" data-page="actions" onclick="navigate('actions')">
          <i class="fas fa-paper-plane"></i><span>営業アクション</span>
        </a>
        <a class="nav-item" data-page="deals" onclick="navigate('deals')">
          <i class="fas fa-handshake"></i><span>商談管理</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-label">運用</div>
        <a class="nav-item" data-page="handoffs" onclick="navigate('handoffs')">
          <i class="fas fa-exchange-alt"></i><span>引き継ぎ</span>
          <span class="nav-badge badge-green" id="badge-handoffs">0</span>
        </a>
        <a class="nav-item" data-page="kpi" onclick="navigate('kpi')">
          <i class="fas fa-chart-bar"></i><span>KPI分析</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-label">システム</div>
        <a class="nav-item" data-page="settings" onclick="navigate('settings')">
          <i class="fas fa-cog"></i><span>設定・データ管理</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">佐</div>
        <div class="user-detail">
          <span class="user-name">佐藤（代表）</span>
          <span class="user-role">Firstweb</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ========== MAIN ========== -->
  <div class="main-wrapper">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" onclick="toggleSidebar()" aria-label="メニュー">
          <i class="fas fa-bars"></i>
        </button>
        <div class="breadcrumb" id="breadcrumb">ダッシュボード</div>
      </div>
      <div class="topbar-right">
        <button class="btn-icon" title="通知" aria-label="通知">
          <i class="fas fa-bell"></i>
        </button>
        <button class="btn-primary btn-sm" onclick="navigate('store-new')">
          <i class="fas fa-plus"></i> 店舗登録
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="main-content" id="main-content" role="main">
      <div class="loading"><div class="spinner"></div>起動中...</div>
    </main>
  </div>

  <!-- ========== MODAL ========== -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal()" role="dialog" aria-modal="true"></div>
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeModal()" aria-label="閉じる">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="modal-body"   id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>

  <!-- ========== TOAST ========== -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ========== SCRIPTS ========== -->
  <!-- データ層（最初に読み込む） -->
  <script src="js/data.js"></script>
  <!-- URLパーサー -->
  <script src="js/url-parser.js"></script>
  <!-- アプリコア -->
  <script src="js/app.js"></script>
  <!-- ページ -->
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/stores.js"></script>
  <script src="js/pages/research.js"></script>
  <script src="js/pages/pipeline.js"></script>
  <script src="js/pages/actions.js"></script>
  <script src="js/pages/deals.js"></script>
  <script src="js/pages/handoffs.js"></script>
  <script src="js/pages/kpi.js"></script>
  <script src="js/pages/settings.js"></script>

</body>
</html>
