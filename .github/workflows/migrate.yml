# 同じコミットのmigrationをdevで適用・検証してからprdへ進めます (#46)。
# GitHub Environments: PreviewのDATABASE_URLはdev、Productionはprd。
# workflow_dispatchはdevのみ。prdへ適用するのはmainへのpushのみです。
name: Apply Migrations

on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
      - "lib/environment-isolation.mjs"
      - "scripts/check-environment.mjs"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-migrations
  cancel-in-progress: false

jobs:
  migrate-dev:
    name: Apply and verify dev migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Preview
    timeout-minutes: 5
    env:
      APP_ENV: dev
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check
      - name: Verify target, apply and verify dev migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm db:check-target
          pnpm db:migrate
          pnpm db:verify-hashes
          pnpm db:verify-fks

  migrate-prd:
    name: Apply verified migrations to production
    needs: migrate-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    env:
      APP_ENV: prd
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify target, apply and verify production migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm db:check-target
          pnpm db:migrate
          pnpm db:verify-hashes
          pnpm db:verify-fks
