# Drizzle マイグレーション自動適用。
#
# main への push で `drizzle/**` に変更があった場合のみ起動し、
# `pnpm db:migrate` (drizzle-kit migrate) を本番 DB に対して実行する。
#
# 安全策:
# - paths 限定: drizzle ファイル変更なしでは workflow 自体が起動しない
# - 冪等性: drizzle-kit は `__drizzle_migrations` テーブルで適用済みを管理し skip
# - timeout: 5 分 (通常 10 秒以内で完了)
# - 失敗時: workflow が赤くなるだけ、 partial 適用リスクは低い (各 SQL = 単一 DDL)
#
# 適用後の検証 (いずれも読み取り専用):
# - `db:verify-hashes`: journal と `__drizzle_migrations` の来歴突合 (適用されたか)
# - `db:verify-fks`: FK ポリシー宣言と DB 実態の一致 (適用の結果が意図どおりか / #238)
#
# 前提: GitHub Secret `DATABASE_URL` に本番 Supabase Postgres connection string を登録。
#       `check-migrations.yml` が PR 段階で整合性チェック済み。

name: Apply Migrations

on:
  push:
    branches:
      - main
    paths:
      - "drizzle/**"
      - ".github/workflows/migrate.yml"

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pending migrations
        run: set -o pipefail; pnpm db:migrate 2>&1 | cat
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # 適用直後に journal と __drizzle_migrations の来歴を突き合わせる。
      # drizzle-kit は created_at の水位線でしか適用判定しないため、
      # 「journal にあるのに永久に適用されない」migration を自力では検知できない
      # (#152 の 0015 がこれで本番だけ壊れた)。既知の乖離は allowlist 済みで、
      # 新規に発生したものだけがここで落ちる。
      - name: Verify migration provenance
        run: set -o pipefail; pnpm db:verify-hashes 2>&1 | cat
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # DDL が本番へ当たった直後に FK ポリシー宣言と DB 実態の一致を確認する (#238)。
      # 前ステップが「migration が適用されたか」を見るのに対し、本ステップは
      # 「適用の結果、制約が意図どおりの ON DELETE になっているか」を見る。
      # 逆方向チェックにより、stores を親とする FK が EXPECTED 未登録のまま増えた場合も
      # ここで落ちる — 削除確認ダイアログの影響カウント漏れ (#229) と同じ経路である。
      #
      # PR 段階では走らせない。PR 時点で migration は本番へ未適用のため、子テーブルを
      # 正しく追加した PR ほど「制約が存在しません」で偽陽性の赤になる。PR 段階では
      # store-cascade-fk-coverage.test.ts (schema.ts のメタデータ走査) が schema.ts と
      # DELETE_IMPACT_CATEGORIES の一致を守るが、同テストは verify-store-cascade-fks.mjs
      # の EXPECTED を検査しないため等価な防御ではない。両方へ正しく登録し EXPECTED
      # だけ忘れた変更を捕まえられるのは、適用後に走る本ステップだけである。
      - name: Verify FK policy against production schema
        run: set -o pipefail; pnpm db:verify-fks 2>&1 | cat
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
