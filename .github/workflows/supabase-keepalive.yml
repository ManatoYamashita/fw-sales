# dev/prdをそれぞれのGitHub Environment Secretで日次pingします (#46)。
# Vercel CronはProductionのみ。本workflowがdevの自動停止を防ぎます。
# 書込みをせず、実接続先のproject refを検証してからapp_settingsを読みます。
name: Supabase Keepalive

on:
  schedule:
    - cron: "0 9 * * *" # 日次 / 09:00 UTC = 18:00 JST
  workflow_dispatch: # 手動実行

# 最小権限: 本ジョブは GITHUB_TOKEN を一切使わない (checkout もしない)。
permissions: {}

jobs:
  keepalive:
    name: Ping ${{ matrix.scope }} database
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: Preview
            scope: dev
            project_ref: llohmzwfqgcrvusxabcb
          - environment: Production
            scope: prd
            project_ref: bqllbsiahnikgerckwoj
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install postgres client
        run: npm install --no-save postgres@3.4.9

      - name: Run read-only keepalive query
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXPECTED_PROJECT_REF: ${{ matrix.project_ref }}
        run: |
          node -e '
          const postgres = require("postgres");
          let url;
          try { url = new URL(process.env.DATABASE_URL); }
          catch { throw new Error("Keepalive DATABASE_URL is missing or invalid."); }
          if (!["postgres:", "postgresql:"].includes(url.protocol)) throw new Error("Keepalive requires PostgreSQL.");
          const ref = process.env.EXPECTED_PROJECT_REF;
          const valid = (url.hostname === `db.${ref}.supabase.co` && decodeURIComponent(url.username) === "postgres")
            || (/^aws-\d+-[a-z0-9-]+\.pooler\.supabase\.com$/.test(url.hostname)
                && decodeURIComponent(url.username) === `postgres.${ref}`);
          if (!valid) throw new Error("Keepalive DATABASE_URL does not match the target project.");
          const sql = postgres(process.env.DATABASE_URL, { prepare: false, max: 1, idle_timeout: 5, connect_timeout: 10 });
          (async () => {
            const start = Date.now();
            try {
              const rows = await sql`select count(*) as keepalive_rows from app_settings`;
              console.log(`OK keepalive_rows=${rows[0].keepalive_rows} time_ms=${Date.now() - start}`);
              await sql.end({ timeout: 5 });
            } catch (e) {
              console.error("KEEPALIVE FAILED:", e.message);
              await sql.end({ timeout: 5 }).catch(() => {});
              process.exit(1);
            }
          })();
          '
