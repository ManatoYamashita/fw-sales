# Deep Research パイプライン ポーリング (Issue #43, Task 4.2)
#
# 30 分間隔で Vercel 上の /api/cron/poll-research を Bearer 認可付きで叩く。
# Vercel Hobby は Cron 1/day 制限のため、GitHub Actions scheduled workflow で代替する。
#
# === 運用者による初回セットアップ手順 (Implementation Notes) ===
#
# 1. CRON_SECRET を生成 (最低 32 バイトのランダム文字列):
#    `openssl rand -hex 32`
#
# 2. GitHub Secrets に登録:
#    Settings → Secrets and variables → Actions → New repository secret
#    - Name: CRON_SECRET   Value: 上記で生成した文字列
#    - Name: VERCEL_URL    Value: https://<your-vercel-deployment>.vercel.app
#
# 3. Vercel Env Vars に **同じ** CRON_SECRET を登録:
#    Vercel Dashboard → Project Settings → Environment Variables
#    - Name: CRON_SECRET   Environments: Production / Preview / Development
#    - Vercel 再デプロイで反映
#
# 4. 動作確認:
#    Actions タブ → "Poll Deep Research Jobs" → "Run workflow" を手動実行し、
#    レスポンス JSON (`{ swept, polled, completed, started, deadline_reached }`)
#    が返ることを確認。
#
# === GitHub Actions 60 日無活動対策 ===
# 別 job `keepalive` を週次で空実行することで、scheduled workflow の自動無効化を回避。
#
# === コスト試算 ===
# `*/5 * * * *` × 各 ~30 秒 = 月 ~4,320 分。Private Repo 無料枠 (2,000 分) を超過する場合は
# 超過分 $0.008/min ≒ ~$18/月。パイプライン側で適応型ポーリング間隔 (45→22→11→5 分) を
# 適用しているため、Gemini API 呼出は実質ジョブ投入数に比例。
# keepalive は週 1 × 5 秒で実質コスト無視。

name: Poll Deep Research Jobs

on:
  schedule:
    # 5 分間隔: パイプライン側で適応型ポーリング (45→22→11→5 分) を適用
    - cron: "*/5 * * * *"
    # 60 日無活動による自動無効化を防ぐ週次 noop (毎週月曜 00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  poll:
    # 通常の */5 cron と workflow_dispatch を本 job が処理。月曜の noop は skip。
    if: ${{ github.event.schedule != '0 0 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call Vercel poll-research endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$VERCEL_URL" ]; then
            echo "::error::CRON_SECRET or VERCEL_URL secret is not configured"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "$VERCEL_URL/api/cron/poll-research" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 90 \
            --fail-with-body)
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi

  keepalive:
    # 60 日無活動対策。毎週月曜 00:00 UTC に空実行して repository を「活動中」に保つ。
    if: ${{ github.event.schedule == '0 0 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Keepalive noop
        run: echo "keepalive — GitHub Actions 60-day inactivity guard"
