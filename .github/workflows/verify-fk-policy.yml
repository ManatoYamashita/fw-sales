# FK ポリシー宣言と本番 DB 実態の定期突合 (Issue #238)。
#
# `scripts/verify-store-cascade-fks.mjs` は 2 方向を検証する:
# 1. 順方向 — EXPECTED の各制約が宣言どおりの ON DELETE を持つか
# 2. 逆方向 — stores を親とする FK を全数列挙し、EXPECTED 未登録のものが無いか (#229)
#
# なぜ migrate.yml だけでは不足なのか:
# `migrate.yml` は `paths: drizzle/**` 限定で起動するため、**migration を伴わない
# ドリフト**(Supabase ダッシュボードでの直編集、帯域外の DDL、リストア差異)は
# 次の migration が来るまで検出されない。#152 の本番 FK ドリフトは migration 0015 が
# drizzle の水位線スキップで適用されず、実際に削除が失敗するまで誰も気づけなかった。
# 本 workflow はその窓を週次で閉じる。
#
# なぜ PR では走らせないのか:
# PR 時点で migration は本番へ未適用のため、子テーブルを正しく追加した PR ほど
# 順方向チェックが「制約が存在しません」で赤になる。確実に偽陽性を生む配置である。
# PR 段階では `store-cascade-fk-coverage.test.ts` (schema.ts のメタデータ走査。DB 非接続)
# が schema.ts / DELETE_IMPACT_CATEGORIES / 本スクリプトの EXPECTED の三者の整合を守る
# (#241 で EXPECTED を `scripts/_store-fk-policy.mjs` へ切り出し、同テストの母集合へ
# 載せた。それ以前は EXPECTED だけ登録を忘れた変更が PR を緑で通過していた)。
# したがって**宣言どうしの食い違いは PR で落ちる**。本 workflow に残る責務は、PR では
# 原理的に確認できない「宣言と本番 DB 実態の一致」だけである。
# PR トリガを持たないことで、fork PR へ `DATABASE_URL` secret が渡る経路も作らない。
#
# なぜ push トリガに guard が要るのか:
# 本 workflow と `migrate.yml` は「`drizzle/**` と本スクリプトを同時に含む main への
# push」に**両方マッチする**。これは stores 子テーブル追加の通常経路であり、実際に
# 本スクリプトを変更した過去 3 push のうち 2 件 (#153 / #228) が該当する。
# 両者は起動順序を持たず、前段ステップ (checkout / pnpm / node+cache / install) が
# 同型のため、実測では migrate.yml が DDL を適用する 2 秒窓に本 workflow の SELECT が
# 着地する (run 33745492910: job 開始ジッタ ±1s、install 完了 T+18s、DDL 適用 T+18〜20s)。
# その状態で読むと順方向が「制約が存在しません」、DROP を伴う push では逆方向が
# 「EXPECTED 未登録」で赤くなる。ドリフト警報を担う workflow が偽の赤を出せば、
# 本物のドリフトも同じ赤に埋もれる。migration 同伴の push は migrate.yml が適用後に
# 検証するため、本 workflow は降りる。
#
# 設計判断:
# - スクリプトは `pg_constraint` への SELECT のみ。データ・スキーマへの書き込みは無い
# - 接続は Node の postgres クライアント。psql(libpq) の厳格な URI パーサは
#   パスワード中の特殊文字 (@ 等) を host と誤読して失敗するため使えない (PR #149 事例)。
#   スクリプト側で `prepare: false` 済みのため Transaction Pooler (6543) でも動作する
# - 週次で十分。migration 起因のドリフトは migrate.yml が即時に捕まえるため、ここが
#   拾うのは人手による帯域外変更に限られ、日次にする根拠が無い
# - 失敗時は 1 回だけ再試行する。本 workflow の赤には「本番 FK がドリフトした」という
#   強い意味を持たせたく、pooler への一過性の接続失敗を同じ赤にしたくないため
#
# 運用上の注意:
# - GitHub は 60 日無活動の **public** repo で scheduled workflow を自動 disable する
#   (`supabase-keepalive.yml` と同じ注意点。private repo は対象外)。長期停止時は
#   Actions の有効状態を確認する。#241 以降、本 workflow が disable されても
#   「EXPECTED 登録漏れ」の窓は開かない — 宣言どうしの整合は PR の Vitest ガードが
#   落とすため、ここで見えなくなるのは帯域外 DDL によるドリフトだけである。
#   実害が重いのは keepalive 側 (7 日 pause → 本番 504 / #147) で、恒久対策は #242 で扱う
# - 失敗時は workflow が red になり、GitHub 標準の失敗通知が本ファイル最終変更者へ飛ぶ
# - 失敗ログには「EXPECTED と DELETE_IMPACT_CATEGORIES / StoreDeleteImpact への追加が
#   必要」まで出るため、そのまま作業指示として読める
#
# 前提: GitHub Secret `DATABASE_URL` に本番 Supabase connection string を登録
#       (`migrate.yml` / `supabase-keepalive.yml` と共用。新規 secret は不要)。

name: Verify FK Policy

on:
  schedule:
    # 週次 / 月曜 03:17 UTC = 12:17 JST。keepalive (09:00 UTC) と時間帯を分け、
    # かつ GitHub 側が混雑する毎正時を避ける。
    - cron: "17 3 * * 1"
  workflow_dispatch: # 手動実行 (migration 後の即時確認・調査用)
  push:
    branches:
      - main
    paths:
      # 期待値そのものを変更したときは、次の定期実行を待たず即座に突合する。
      # migration を同伴する push は下の guard ステップで降りる。
      - "scripts/verify-store-cascade-fks.mjs"
      # 期待値 (EXPECTED) の実体。#241 で本体から切り出したため、ここを欠かすと
      # 「期待値を書き換えたら即座に突合する」という上の意図が黙って効かなくなる。
      - "scripts/_store-fk-policy.mjs"
      - ".github/workflows/verify-fk-policy.yml"

# 最小権限: checkout と compare API の読み取りにのみ GITHUB_TOKEN を使う。
permissions:
  contents: read

jobs:
  verify-fk-policy:
    name: Verify store FK policy against production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # migrate.yml と並走する push を検出して降りる (ファイル冒頭「なぜ push トリガに
      # guard が要るのか」を参照)。判定できない場合は検証を実行する — ドリフトの
      # 見逃しのほうが、偽陽性の赤より高くつくため。
      - name: Skip when the same push also applies migrations
        id: guard
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || [[ "$BEFORE" =~ ^0{40}$ ]]; then
            echo "before=$BEFORE のため差分を確定できない。検証を実行する。"
            exit 0
          fi
          if ! changed=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${AFTER}" \
            --jq '.files[].filename'); then
            echo "compare API の取得に失敗した。検証を実行する。"
            exit 0
          fi
          # grep をパイプで受けると、早期終了による SIGPIPE が pipefail で偽の失敗に
          # なるため here-string で渡す。
          if grep -q '^drizzle/' <<< "$changed"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "この push は drizzle/** を含む。migrate.yml が DDL 適用後に db:verify-fks を実行するため、本 workflow では検証しない。"
          else
            echo "この push に drizzle/** の変更は無い。検証を実行する。"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # 1 回だけ再試行する。ポリシー違反なら再試行しても同じく落ちるため検知力は
      # 鈍らず、pooler への一過性の接続失敗だけを赤から除ける。
      - name: Verify FK policy against production schema
        if: steps.guard.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          if pnpm db:verify-fks 2>&1 | cat; then exit 0; fi
          echo "--- 1 回目が失敗した。一過性の接続失敗と切り分けるため 15 秒後に再試行する ---"
          sleep 15
          pnpm db:verify-fks 2>&1 | cat
